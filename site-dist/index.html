<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>thesis-lint · 论文参考文献在线体检</title>
<meta name="description" content="检查 Word 论文参考文献是否符合 GB/T 7714-2025。文档在浏览器本地解析，不会上传。">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.7em; margin-bottom: 6px; }
  header h1 span { color: #58a6ff; }
  header p { color: #8b949e; }
  .card {
    width: 100%; max-width: 860px;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 20px;
  }
  #drop {
    border: 2px dashed #388bfd66; border-radius: 10px;
    background: #121d2f; text-align: center;
    padding: 44px 16px; cursor: pointer; user-select: none;
    transition: all .15s ease;
  }
  #drop:hover, #drop.over { background: #1a2740; border-color: #388bfd; }
  #drop .big { font-size: 1.25em; color: #79c0ff; margin-bottom: 6px; }
  #drop .sub { color: #8b949e; font-size: .92em; }
  #drop .sub em { color: #d29922; font-style: normal; }
  #actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button {
    background: #21262d; color: #e6edf3; border: 1px solid #364049;
    border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: .95em;
  }
  button:hover:not(:disabled) { background: #2c3642; border-color: #58a6ff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: #238636; border-color: #2ea043; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  #stage { margin-top: 14px; color: #8b949e; font-size: .95em; min-height: 1.4em; }
  #stage .dot { display: inline-block; animation: blink 1.2s infinite; margin-right: 6px; color: #58a6ff; }
  @keyframes blink { 50% { opacity: .25; } }
  #stats { display: none; gap: 10px; margin: 14px 0 4px; flex-wrap: wrap; }
  .stat { border-radius: 6px; padding: 4px 12px; font-size: .92em; border: 1px solid; }
  .stat.ok   { color: #7ee787; border-color: #1a7f37; background: #12261e; }
  .stat.err  { color: #ff7b72; border-color: #b62324; background: #25171c; }
  .stat.warn { color: #e3b341; border-color: #9e6a03; background: #241d12; }
  #report {
    display: none; margin-top: 12px;
    background: #0a0e14; border: 1px solid #21262d; border-radius: 10px;
    padding: 18px; font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-all;
  }
  #report .e { color: #ff7b72; font-weight: bold; }
  #report .w { color: #e3b341; font-weight: bold; }
  #report .h { color: #7ee787; }
  footer { margin-top: 26px; color: #8b949e; font-size: .9em; text-align: center; line-height: 1.9; }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .lock { color: #d29922; }
</style>
</head>
<body>
<header>
  <h1>🎓 thesis<span>·</span>lint</h1>
  <p>Word 论文参考文献「国标体检」—— 是否符合 GB/T 7714-2025，3 秒见分晓</p>
</header>

<div class="card">
  <div id="drop">
    <div class="big">📄 将论文 .docx 拖到这里</div>
    <div class="sub">或点击选择文件 · 文档<b>仅在浏览器本地解析</b>，不会上传到任何服务器</div>
    <div class="sub" style="margin-top:6px">只支持 .docx<em>（.doc 请先用 Word 另存为 .docx）</em></div>
  </div>

  <div id="actions">
    <button class="primary" id="btnDemo" disabled>🐍 用示例论文试一试</button>
    <button id="btnCopy" disabled>复制报告</button>
    <button id="btnMd" disabled>下载 Markdown 报告</button>
    <span id="engineBadge" class="lock">⏳ 引擎加载中…</span>
  </div>

  <div id="stage"></div>
  <div id="stats">
    <span class="stat ok" id="stPass"></span>
    <span class="stat err" id="stErr"></span>
    <span class="stat warn" id="stWarn"></span>
  </div>
  <div id="report"></div>
</div>

<footer>
  由 <a href="https://github.com/huashuimoyv/thesis-lint">thesis-lint</a> 提供支持 ·
  解析引擎运行在你的浏览器（Pyodide / WebAssembly）<br>
  检查结果仅供参考，最终格式认定以学校要求为准 ·
  喜欢的话去 <a href="https://github.com/huashuimoyv/thesis-lint">GitHub</a> 点个 ⭐
</footer>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.6/full/pyodide.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $("stage"), report = $("report");

  function setStage(msg, spin = true) {
    stage.innerHTML = spin ? `<span class="dot">▶</span>${msg}` : msg;
  }

  /* ---------- Pyodide 引擎 ---------- */
  const INDEX = "https://cdn.jsdelivr.net/pyodide/v314.0.6/full/";
  let enginePromise = null;

  async function getEngine() {
    if (!enginePromise) {
      enginePromise = (async () => {
        setStage("首次访问需下载 Python 引擎（约 15 MB，浏览器会缓存，下次秒开）…");
        const py = await loadPyodide({ indexURL: INDEX });
        setStage("加载文档解析组件（lxml / python-docx）…");
        await py.loadPackage("micropip");
        await py.loadPackage("lxml");
        const micropip = py.pyimport("micropip");
        const manifest = await (await fetch("./wheels/manifest.json")).json();
        setStage("加载 thesis-lint 校验规则…");
        await micropip.install(manifest.wheels.map(w => "./wheels/" + w));
        await py.runPythonAsync(PY_SETUP);
        setStage("引擎就绪 ✓", false);
        $("engineBadge").textContent = "✅ 引擎已就绪";
        $("engineBadge").className = "";
        $("engineBadge").style.color = "#7ee787";
        $("btnDemo").disabled = false;
        return py;
      })().catch(err => { enginePromise = null; throw err; });
    }
    return enginePromise;
  }

  /* 页面打开即后台预热引擎 */
  getEngine().catch(err => {
    $("engineBadge").textContent = "⚠️ 引擎加载失败（检查网络后刷新重试）";
    console.error(err);
  });

  /* ---------- Python 侧胶水代码 ---------- */
  const PY_SETUP = `
import json
from pathlib import Path
from thesislint.cli import analyze
from thesislint.report import build_json_report, build_text_report, build_markdown_report

def web_check(filename: str) -> str:
    r = analyze(Path(filename))
    data = {
        "text": build_text_report(r),
        "markdown": build_markdown_report(r),
        "stats": {"total": len(r.entries), "errors": r.error_count, "warns": r.warn_count,
                  "passed": len(r.entries) - sum(1 for e in r.entries if e.issues)},
        "found": r.found_section,
    }
    return json.dumps(data, ensure_ascii=False)

def web_demo(filename: str) -> str:
    from docx import Document
    doc = Document()
    doc.add_heading("参考文献", level=1)
    entries = [
        "[1] 刘知远. 大模型时代的自然语言处理[M]. 北京: 清华大学出版社, 2023: 15-20.",
        "[2] Vaswani A, Shazeer N, Parmar J, et al. Attention is all you need[C]//NeurIPS. 2017: 5998-6008.",
        "[3] 张三，李四. 一种深度学习方法[J]. 计算机学报，2024，47（3）：100-110",
        "[4] Brown T B, Mann B, Ryder N, Subbiah M, Kaplan J. Language models are few-shot learners[J]. NeurIPS, 2020.",
        "[5] 中国互联网络信息中心. 第53次中国互联网络发展状况统计报告[R/OL]. (2024-03-22)[2025-01-10]. https://www.cnnic.net.cn/report.html.",
    ]
    for e in entries:
        doc.add_paragraph(e)
    doc.save(filename)
    return web_check(filename)

"ready"
`;

  /* ---------- 检查流程 ---------- */
  let busy = false;

  async function checkFile(file) {
    if (busy) return;
    if (!file.name.toLowerCase().endsWith(".docx")) {
      setStage("⚠️ 只支持 .docx 文件（.doc 请先用 Word 另存为 .docx）", false);
      return;
    }
    busy = true;
    setButtons(false);
    try {
      const py = await getEngine();
      setStage(`正在检查 ${file.name} …`);
      const buf = new Uint8Array(await file.arrayBuffer());
      py.FS.writeFile(file.name, buf);
      await present(py, file.name);
    } catch (err) {
      setStage("❌ 检查失败：" + (err.message || err), false);
      console.error(err);
    } finally {
      busy = false;
      setButtons(true);
    }
  }

  async function checkDemo() {
    if (busy) return;
    busy = true;
    setButtons(false);
    try {
      const py = await getEngine();
      setStage("正在生成并检查示例论文 …");
      await present(py, "__demo__.docx", "web_demo");
    } catch (err) {
      setStage("❌ 检查失败：" + (err.message || err), false);
      console.error(err);
    } finally {
      busy = false;
      setButtons(true);
    }
  }

  async function present(py, filename, fn = "web_check") {
    const jsonStr = await py.runPythonAsync(`${fn}(${JSON.stringify(filename)})`);
    const data = JSON.parse(jsonStr);
    render(data);
    setStage("", false);
  }

  function render(data) {
    if (!data.found) {
      report.style.display = "block";
      report.textContent = data.text;
      $("stats").style.display = "none";
      return;
    }
    $("stPass").textContent = `✅ ${data.stats.passed} 条通过`;
    $("stErr").textContent = `❌ ${data.stats.errors} 个错误`;
    $("stWarn").textContent = `⚠️ ${data.stats.warns} 个警告`;
    $("stats").style.display = "flex";
    $("stErr").style.display = data.stats.errors ? "inline-block" : "none";
    $("stWarn").style.display = data.stats.warns ? "inline-block" : "none";

    const html = data.text
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/(体检结果：.*)/, `<span class="h">$1</span>`)
      .replace(/\[ERROR\]/g, `<span class="e">[ERROR]</span>`)
      .replace(/\[WARN \]/g, `<span class="w">[WARN ]</span>`);
    report.innerHTML = html;
    report.style.display = "block";
    $("btnCopy").disabled = false;
    $("btnMd").disabled = false;
    $("btnMd").dataset.md = data.markdown;
  }

  function setButtons(on) {
    $("btnDemo").disabled = !(on && enginePromise);
    $("btnCopy").disabled = !on || !$("btnCopy").textContent || report.style.display === "none";
    if (on && report.style.display !== "none") { $("btnCopy").disabled = false; $("btnMd").disabled = false; }
  }

  /* ---------- 事件绑定 ---------- */
  const drop = $("drop");
  drop.addEventListener("click", () => {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".docx";
    input.onchange = () => input.files[0] && checkFile(input.files[0]);
    input.click();
  });
  ["dragover", "dragenter"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev =>
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f) checkFile(f);
  });
  /* 整页拖入也接收 */
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => {
    e.preventDefault();
    const f = e.dataTransfer && e.dataTransfer.files[0];
    if (f) checkFile(f);
  });

  $("btnDemo").addEventListener("click", checkDemo);
  $("btnCopy").addEventListener("click", () => {
    navigator.clipboard.writeText(report.textContent)
      .then(() => setStage("✅ 已复制到剪贴板", false))
      .catch(() => setStage("复制失败，请手动选择文本", false));
  });
  $("btnMd").addEventListener("click", () => {
    const blob = new Blob([$("btnMd").dataset.md || ""], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "参考文献体检报告.md";
    a.click();
    URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
